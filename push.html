<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Essig MFG notifications</title>
  <!-- NEW (10/15, H10): turns on push notifications for this device. The My Tasks app (Settings tab)
       sends people here with #key=<the app's public push key>&ret=<the My Tasks link>. The phone asks to
       Allow; the device's push address is handed back to My Tasks (?pushsub=...), which saves it for the
       signed-in person. Push has to live here: the My Tasks page runs on Google's site, which can't
       receive push. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <meta name="theme-color" content="#000070">
  <style>
    :root { --bg: #e8eaed; --ink: #000070; --ink-muted: #3b4150; --brand-navy: #000070; --brand-red: #cc3038;
            --card: rgba(30, 35, 44, 0.8); --text: #eceff4; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
                 font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 24px 16px 40px; text-align: center; }
    .logo { width: min(55vw, 220px); height: auto; display: block; margin: 8px auto 4px; }
    h1 { font-size: 22px; margin: 0 0 6px; color: var(--brand-navy); }
    .sub { color: var(--ink-muted); }
    .btn { display: inline-block; font: inherit; font-weight: 600; background: var(--brand-red); color: #fff; border: 0;
           border-radius: 10px; padding: 14px 26px; margin: 20px 6px 0; text-decoration: none; cursor: pointer; font-size: 18px; }
    .btn.sec { background: transparent; color: var(--brand-navy); border: 2px solid var(--brand-navy); font-size: 16px; padding: 10px 20px; }
    .box { text-align: left; background: var(--card); color: var(--text); border-left: 4px solid var(--brand-red);
           border-radius: 10px; padding: 14px 18px; margin-top: 22px; }
    .box b { color: #fff; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="logo.svg" alt="Essig MFG">
    <h1>Notifications</h1>
    <div class="sub" id="msg">Essig MFG sends you notifications about your tasks.</div>
    <button class="btn" id="go" type="button" hidden>Continue</button>
    <a class="btn sec" id="back" href="#" hidden>Back to My Tasks</a>
    <div class="box" id="help" hidden></div>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const hash = new URLSearchParams(location.hash.slice(1));
    const KEY = hash.get("key") || "";
    // Only ever hand the subscription back to a Google Apps Script web app link.
    const RET = /^https:\/\/script\.google\.com\/[^\s?#]+\/exec$/.test(hash.get("ret") || "") ? hash.get("ret") : "";
    if (RET) { $("back").href = RET; $("back").hidden = false; }

    const ua = navigator.userAgent;
    const iOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
    const label = (iOS ? (/iPad/.test(ua) || !/iPhone/.test(ua) ? "iPad" : "iPhone") : /Android/.test(ua) ? "Android" : /Windows/.test(ua) ? "Windows" : /Mac/.test(ua) ? "Mac" : "Device") +
      (/Edg\//.test(ua) ? " Edge" : /Chrome\//.test(ua) && !iOS ? " Chrome" : /Firefox\//.test(ua) ? " Firefox" : iOS ? " app" : "");

    function say(text, help) {
      $("msg").textContent = text;
      if (help) { $("help").innerHTML = help; $("help").hidden = false; } else $("help").hidden = true;
    }
    function b64uToBytes(s) {
      s = s.replace(/-/g, "+").replace(/_/g, "/");
      while (s.length % 4) s += "=";
      const b = atob(s), u = new Uint8Array(b.length);
      for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
      return u;
    }
    function sameKey(sub) {
      try {
        const k = new Uint8Array(sub.options.applicationServerKey), want = b64uToBytes(KEY);
        return k.length === want.length && k.every((v, i) => v === want[i]);
      } catch (e) { return false; }
    }

    const supported = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
    if (!KEY || !RET) {
      say("Open this from the Settings tab in the Essig MFG app.");
    } else if (iOS && !standalone) {
      say("On iPhone and iPad, notifications only work inside the Essig MFG app.",
        "1. Add the app to your home screen from <b>Safari</b>: <b>Share</b>, then <b>Add to Home Screen</b>.<br>" +
        "2. Open it from the new Essig MFG icon, go to <b>Settings</b>, and tap <b>Turn on notifications</b> there.");
    } else if (!supported) {
      say("This browser can't receive notifications.", "Use <b>Chrome</b> or <b>Edge</b> (Android, Windows), or the Essig MFG app on iPhone (iOS 16.4 or later).");
    } else if (Notification.permission === "denied") {
      say("Notifications are blocked on this device.",
        "To unblock them: open this browser's (or the app's) <b>site settings</b> for <b>essigmfg.github.io</b>, set <b>Notifications</b> to <b>Allow</b>, then come back and tap Turn on notifications again." +
        (iOS ? "<br>iPhone: <b>Settings</b>, <b>Notifications</b>, <b>Essig MFG</b>, turn on <b>Allow Notifications</b>." : ""));
    } else {
      $("go").hidden = false;
    }

    $("go").addEventListener("click", async () => {
      $("go").disabled = true;
      try {
        const perm = await Notification.requestPermission();   // must come straight from the tap
        if (perm !== "granted") {
          $("go").disabled = false;
          say(perm === "denied" ? "Notifications are blocked on this device." : "Notifications weren't allowed.",
            "You can turn them on later from the Settings tab in the app.");
          return;
        }
        say("Turning on notifications...");
        await navigator.serviceWorker.register("sw.js");
        const reg = await navigator.serviceWorker.ready;
        let sub = await reg.pushManager.getSubscription();
        if (sub && !sameKey(sub)) { await sub.unsubscribe(); sub = null; }   // made for another copy of the app
        if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uToBytes(KEY) });
        say("Done. Taking you back to My Tasks...");
        location.replace(RET + "?pushsub=" + encodeURIComponent(JSON.stringify(sub)) + "&pushlabel=" + encodeURIComponent(label));
      } catch (e) {
        $("go").disabled = false;
        say("That didn't work: " + (e && e.message ? e.message : e), "Tap Continue to try again.");
      }
    });
  </script>
</body>
</html>
