<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Essig MFG Shop</title>
  <!-- H7 launcher: gives the My Tasks page an Essig MFG app icon on iPhone, Android and Windows.
       The icon and name come from this page (and manifest.webmanifest); tapping the app opens
       the live My Tasks web app, which still signs people in with their essigmfg.com account. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
  <!-- iPhone icon: opaque 180x180 (iOS rounds it). ?v= forces iPhones to fetch a changed icon. -->
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=5">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="icons/apple-touch-icon.png?v=5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Essig MFG">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#000070">
  <style>
    /* Same fixed look as the My Tasks page (no light/dark switching). */
    :root { --bg: #e8eaed; --ink: #000070; --ink-muted: #3b4150; --brand-navy: #000070; --brand-red: #cc3038;
            --card: rgba(30, 35, 44, 0.8); --text: #eceff4; --muted: #a2abbb; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
                 font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 24px 16px 40px; text-align: center; }
    .logo { width: min(70vw, 300px); height: auto; display: block; margin: 8px auto 4px; }
    h1 { font-size: 22px; margin: 0 0 4px; color: var(--brand-navy); }
    .sub { color: var(--ink-muted); font-size: 14px; }
    .btn { display: inline-block; font: inherit; font-weight: 600; background: var(--brand-red); color: #fff; border: 0;
           border-radius: 10px; padding: 12px 22px; margin: 18px 6px 0; text-decoration: none; cursor: pointer; }
    .btn.sec { background: transparent; color: var(--brand-navy); border: 2px solid var(--brand-navy); }
    .steps { text-align: left; background: var(--card); color: var(--text); border-left: 4px solid var(--brand-red);
             border-radius: 10px; padding: 14px 18px; margin-top: 26px; }
    .steps h2 { font-size: 15px; margin: 0 0 8px; letter-spacing: .03em; text-transform: uppercase; }
    .steps ol { margin: 0; padding-left: 22px; }
    .steps li { margin: 4px 0; }
    .steps b { color: #fff; }
    .steps + .steps { margin-top: 12px; }
    .steps .mine { font-weight: 400; text-transform: none; color: var(--muted); }
    .steps a { color: #fff; font-weight: 600; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="logo.svg" alt="Essig MFG">

    <!-- NEW (10/15, H10): first open of the installed app on a device: one tap to turn on notifications
         (phones only show their Allow box after a tap). Never shown again on that device once answered. -->
    <section id="pushView" hidden>
      <h1>Notifications</h1>
      <div class="sub">Essig MFG sends you notifications about your tasks: new tasks, due dates, answers to your requests.</div>
      <button class="btn" id="pushGo" type="button">Continue</button>
      <a class="btn sec" id="pushSkip" href="#">Not now</a>
      <div class="sub" id="pushMsg"></div>
    </section>

    <!-- Shown when opened from the home screen / Start menu (installed app) -->
    <section id="appView" hidden>
      <h1>My Tasks</h1>
      <div class="sub" id="appMsg">Opening...</div>
      <a class="btn" id="openApp" href="#" hidden>Open My Tasks</a>
    </section>

    <!-- Shown in a normal browser tab: open the page, or install the app -->
    <section id="webView" hidden>
      <h1>Essig MFG Shop</h1>
      <div class="sub">Your tasks, the team board and job hours. Sign in with your essigmfg.com Google account.</div>
      <a class="btn" id="openWeb" href="#">Open My Tasks</a>
      <button class="btn sec" id="installBtn" type="button" hidden>Install app</button>

      <div id="howto"></div>
    </section>
  </main>

  <script>
    // The live My Tasks web app (People!I2 on the live sheet). Change it here if the deployment ever changes.
    const MY_TASKS_URL = "https://script.google.com/a/macros/essigmfg.com/s/AKfycby26EECrHrTDdZoayEw8cQ9zuoNulVCeHzgiMZ6qHs78JacoCln5r8oM-sQdLnOit8h/exec";

    const $ = id => document.getElementById(id);
    $("openApp").href = $("openWeb").href = MY_TASKS_URL;

    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

    // Installed app = opened from its icon: display-mode covers Android/Windows, navigator.standalone covers
    // iPhone. Never decide this from the URL: iOS 26 loads start_url in the background while adding the app
    // to the home screen, and redirecting that load to Google left iOS with no icon (the navy "E", 10/13).
    const isApp = matchMedia("(display-mode: standalone)").matches
      || matchMedia("(display-mode: window-controls-overlay)").matches
      || navigator.standalone === true;

    // NEW (10/15, H10): notifications on at first open (Nate: "on by default as soon as the app gets installed").
    // The live app's public push key (script property VAPID_PUB of the live project; it is meant to be public).
    // If the live keys are ever made again, put the new one here.
    const PUSH_KEY = "BIpWY0CXuebNVuSU1DLxcDudOdFYXg30hBC01H64jMYYX_aCjP-6pqjX4LMCWOY81MC0Ym-LviCW4zNLwe0-lks";
    const canPush = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
    let pushAsked = false;
    try { pushAsked = localStorage.getItem("essigPushAsked") === "1"; } catch (e) {}
    function markAsked() { try { localStorage.setItem("essigPushAsked", "1"); sessionStorage.setItem("essigOpened", "1"); } catch (e) {} }
    function b64uToBytes(s) {
      s = s.replace(/-/g, "+").replace(/_/g, "/");
      while (s.length % 4) s += "=";
      const b = atob(s), u = new Uint8Array(b.length);
      for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
      return u;
    }
    function deviceLabel() {
      const ua = navigator.userAgent;
      const ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      return (ios ? (/iPhone/.test(ua) ? "iPhone" : "iPad") : /Android/.test(ua) ? "Android" : /Windows/.test(ua) ? "Windows" : /Mac/.test(ua) ? "Mac" : "Device") +
        (/Edg\//.test(ua) ? " Edge" : /Chrome\//.test(ua) && !ios ? " Chrome" : ios ? " app" : "");
    }
    async function turnOnPush() {
      $("pushGo").disabled = true;
      markAsked();
      try {
        const perm = await Notification.requestPermission();   // straight from the tap, so the phone shows its Allow box
        if (perm !== "granted") { location.replace(MY_TASKS_URL); return; }
        $("pushMsg").textContent = "Turning on notifications...";
        await navigator.serviceWorker.register("sw.js");
        const reg = await navigator.serviceWorker.ready;
        let sub = await reg.pushManager.getSubscription();
        const want = b64uToBytes(PUSH_KEY);
        const same = s => { try { const k = new Uint8Array(s.options.applicationServerKey); return k.length === want.length && k.every((v, i) => v === want[i]); } catch (e) { return false; } };
        if (sub && !same(sub)) { await sub.unsubscribe(); sub = null; }
        if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: want });
        // The app saves it for whoever is signed in (pushfirst = stay on the Board, no Settings detour).
        location.replace(MY_TASKS_URL + "?pushsub=" + encodeURIComponent(JSON.stringify(sub)) +
          "&pushlabel=" + encodeURIComponent(deviceLabel()) + "&pushfirst=1");
      } catch (e) {
        $("pushMsg").textContent = "That didn't work (" + (e && e.message ? e.message : e) + "). You can turn notifications on later in the app: Menu, then Settings.";
        setTimeout(() => location.replace(MY_TASKS_URL), 4000);
      }
    }
    $("pushGo").addEventListener("click", turnOnPush);
    $("pushSkip").addEventListener("click", e => { e.preventDefault(); markAsked(); location.replace(MY_TASKS_URL); });

    if (isApp && canPush && Notification.permission === "default" && !pushAsked) {
      $("pushView").hidden = false;   // first open on this device: ask once
    } else if (isApp) {
      $("appView").hidden = false;
      // Go straight to My Tasks the first time. If the person comes back here (the app's back/close
      // button returns to this page), show a button instead of bouncing them out again.
      let opened = false;
      try { opened = sessionStorage.getItem("essigOpened") === "1"; sessionStorage.setItem("essigOpened", "1"); } catch (e) {}
      if (opened) {
        $("appMsg").textContent = "Tap below to open your tasks.";
        $("openApp").hidden = false;
      } else {
        setTimeout(() => location.replace(MY_TASKS_URL), 350);
      }
    } else {
      $("webView").hidden = false;
      showSteps();
    }

    // Android Chrome and Windows Edge/Chrome: a one-tap Install button when the browser allows it.
    let installEvent = null;
    addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvent = e; $("installBtn").hidden = false; });
    $("installBtn").addEventListener("click", async () => {
      if (!installEvent) return;
      installEvent.prompt();
      await installEvent.userChoice;
      installEvent = null;
      $("installBtn").hidden = true;
    });
    addEventListener("appinstalled", () => { $("installBtn").hidden = true; });

    function showSteps() {
      const ua = navigator.userAgent;
      const iOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      const android = /Android/.test(ua);
      const edge = /Edg\//.test(ua);
      const steps = {
        iphone: ["Add to your iPhone home screen", [
          "Open this page in <b>Safari</b>.",
          "Tap the <b>Share</b> button (the square with an arrow pointing up).",
          "Scroll down and tap <b>Add to Home Screen</b>.",
          "Tap <b>Add</b>. The Essig MFG icon appears on your home screen."]],
        // Backup for iPhones that show a letter instead of the logo (iOS 27.2 on Nate's phone, 10/13):
        // a Web Clip profile carries the icon inside it, so iOS doesn't have to download it.
        iphone2: ["iPhone backup: if you see a letter instead of the logo", [
          "Delete the letter icon: press and hold it, tap <b>Remove App</b>, then <b>Delete from Home Screen</b>.",
          'In Safari, tap <a href="EssigMFG.mobileconfig">Download the Essig MFG app profile</a>, then tap <b>Allow</b>.',
          "Open <b>Settings</b> and tap <b>Profile Downloaded</b> near the top.",
          "Tap <b>Install</b>, enter your passcode, then <b>Install</b> again. It says <b>Not Verified</b>: that's expected, it only adds this one icon.",
          "Open My Tasks from the new Essig MFG icon."]],
        android: ["Add to your Android home screen", [
          "Open this page in <b>Chrome</b>.",
          "Tap <b>Install app</b> above, or the <b>&#8942;</b> menu (top right), then <b>Install app</b> (some phones say <b>Add to Home screen</b>).",
          "Tap <b>Install</b>. The Essig MFG icon appears on your home screen."]],
        chrome: ["Install on Windows (Google Chrome)", [
          "Click <b>Install app</b> above, or the <b>&#8942;</b> menu (top right), then <b>Cast, save, and share</b>, then <b>Install page as app</b>.",
          "Click <b>Install</b>. Essig MFG Shop opens in its own window and is added to the Start menu and desktop.",
          "To pin it: right-click <b>Essig MFG Shop</b> in the Start menu and choose <b>Pin to taskbar</b> or <b>Pin to Start</b>."]],
        edge: ["Install on Windows (Microsoft Edge)", [
          "Click <b>Install app</b> above, or the <b>&#8943;</b> menu (top right), then <b>Apps</b>, then <b>Install this site as an app</b>.",
          "Click <b>Install</b>. Essig MFG Shop opens in its own window and is added to the Start menu.",
          "To pin it: right-click <b>Essig MFG Shop</b> in the Start menu and choose <b>Pin to taskbar</b> or <b>Pin to Start</b>."]]
      };   // every device listed, always in this order (phones first, Nate 10/13)
      const mine = iOS ? "iphone" : android ? "android" : edge ? "edge" : "chrome";
      $("howto").innerHTML = Object.keys(steps).map(k => '<div class="steps"><h2>' + steps[k][0] +
        (k === mine ? ' <span class="mine">(this device)</span>' : "") + "</h2><ol>" +
        steps[k][1].map(s => "<li>" + s + "</li>").join("") + "</ol></div>").join("");
    }
  </script>
</body>
</html>
